<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#002387">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Easo PE">
<meta name="description" content="Evaluación por competencias y trazabilidad de RA · CFGS Proyectos de Edificación · Easo Politeknikoa">
<link rel="manifest" href="manifest.webmanifest">

<title>Easo Politeknikoa · Dpto. Edificación y Obra Civil</title>
<style>
  :root {
    --navy: #002387; --navy-dark: #00185c; --navy-soft: #eef2ff;
    --gold: #d4a017; --cyan: #0ea5e9;
    --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --green: #15803d; --green-bg: #dcfce7;
    --amber: #b45309; --amber-bg: #fef3c7;
    --red: #b91c1c; --red-bg: #fee2e2;
    --gray-bg: #f1f5f9;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100vh;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* CABECERA */
  header { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 40; box-shadow: 0 2px 10px rgba(0, 24, 92, 0.18); padding-top: env(safe-area-inset-top, 0px); }
  .header-top { max-width: 1280px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-logo-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-emblem { width: 42px; height: 42px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
  .brand-wordmark { display: flex; flex-direction: column; line-height: 1.02; font-weight: 700; font-size: 1.08rem; letter-spacing: -0.02em; }
  .brand-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.26); flex-shrink: 0; }
  .brand-dept { display: flex; flex-direction: column; min-width: 0; }
  .brand-dept-title { font-size: 0.94rem; font-weight: 700; line-height: 1.2; }
  .brand-dept-sub { font-size: 0.76rem; color: rgba(255,255,255,0.84); line-height: 1.2; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-hdr { background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 7px 11px; font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s; }
  .btn-hdr:hover { background: rgba(255,255,255,0.24); }
  .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; display: inline-block; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,0.22); }
  .sync-dot.ok { background: #22c55e; }
  .sync-dot.pending { background: #f59e0b; }
  .sync-dot.err { background: #ef4444; }
  .sync-dot.busy { background: #38bdf8; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .demo-banner { background: var(--amber-bg); color: #92400e; font-size: 0.8rem; font-weight: 600; padding: 6px 14px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
  .demo-banner button { background: #fff; border: 1px solid #fcd34d; color: #92400e; border-radius: 6px; padding: 2px 10px; font-weight: 700; cursor: pointer; }

  .mobile-context-bar { display: none; background: var(--navy-dark); padding: 7px 12px; border-top: 1px solid rgba(255,255,255,0.12); }
  .mobile-context-btn { width: 100%; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; text-align: left; }
  .mobile-context-btn .ctx-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .selectors-bar { background: var(--navy-dark); padding: 10px 18px; }
  .selectors-grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 175px 40px 245px 1fr; gap: 8px; align-items: center; }
  select, input[type="text"], input[type="number"], input[type="url"], input[type="password"], input[type="search"], input[type="date"], textarea {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.88rem;
    background: #fff; color: var(--text); min-height: 38px; font-family: inherit;
  }
  textarea { resize: vertical; }
  select:focus, input:focus, textarea:focus { outline: 2px solid rgba(0,35,135,0.22); border-color: var(--navy); }
  .selectors-bar select { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); font-weight: 600; }
  .selectors-bar select option { color: var(--text); background: #fff; }
  .btn-new-year { background: var(--gold); color: #111827; border: none; border-radius: 8px; width: 40px; height: 38px; font-size: 1.3rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-new-year:hover { filter: brightness(1.07); }

  .nav-tabs { max-width: 1280px; margin: 0 auto; display: flex; padding: 0 14px; gap: 6px; }
  .tab-btn { background: transparent; border: none; color: rgba(255,255,255,0.78); padding: 11px 14px; font-size: 0.86rem; font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
  .tab-btn:hover { color: #fff; }
  .tab-btn.active { color: #fff; border-bottom-color: var(--gold); }
  .tricolor-bar { height: 3px; background: linear-gradient(90deg, var(--navy-dark) 0%, var(--navy-dark) 35%, var(--gold) 35%, var(--gold) 68%, var(--cyan) 68%, var(--cyan) 100%); }

  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(15,23,42,0.08); z-index: 45; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottom-nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .bnav-btn { background: transparent; border: none; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 0.72rem; font-weight: 700; cursor: pointer; position: relative; }
  .bnav-btn.active { color: var(--navy); }
  .bnav-btn.active::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; background: var(--navy); border-radius: 0 0 3px 3px; }

  /* CONTENIDO */
  main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 18px 18px 34px; flex: 1; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar-left, .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar input.search-box { width: 240px; min-width: 0; max-width: 260px; }
  .toolbar select { flex-shrink: 0; }
  .toolbar-left { flex: 1 1 auto; }
  .btn { padding: 8px 13px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 0.84rem; font-weight: 600; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(15,23,42,0.03); text-decoration: none; }
  .btn:hover { background: #f1f5f9; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-danger { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; min-height: 32px; }
  .icon-btn { border: 1px solid var(--border); background: #fff; border-radius: 6px; min-width: 28px; min-height: 28px; padding: 0 6px; cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--text); }
  .icon-btn.danger { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
  .muted { color: var(--muted); }
  .small { font-size: 0.78rem; }

  .stats-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
  .stat-label { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-val { font-size: 1.45rem; font-weight: 800; color: var(--navy); margin-top: 2px; }
  .stat-card.s-ok .stat-val { color: var(--green); }
  .stat-card.s-prog .stat-val { color: var(--amber); }
  .stat-card.s-ko .stat-val { color: var(--red); }
  .stat-card.s-none .stat-val { color: var(--muted); }

  .cards-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1060px) { .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .student-card { min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 11px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .student-name { font-weight: 700; font-size: 0.98rem; }
  .student-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
  .badge { padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; white-space: nowrap; display: inline-block; }
  .b-ok { background: var(--green-bg); color: var(--green); }
  .b-prog { background: var(--amber-bg); color: var(--amber); }
  .b-ko { background: var(--red-bg); color: var(--red); }
  .b-none { background: var(--gray-bg); color: var(--muted); }
  .comp-list { display: flex; flex-direction: column; gap: 7px; }
  .comp-row { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .comp-row.inactive { opacity: 0.55; }
  .comp-info { flex: 1; min-width: 0; }
  .comp-title { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp-ras { font-size: 0.72rem; color: var(--navy); font-weight: 600; margin-top: 1px; }
  .comp-score { font-size: 0.82rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; min-width: 48px; text-align: center; }
  .rec-mark { font-size: 0.7rem; color: var(--amber); font-weight: 700; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--navy); border-radius: 999px; transition: width 0.25s; }
  .tag { font-size: 0.66rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); margin-left: 4px; white-space: nowrap; }
  .tag-rec { background: var(--amber-bg); color: var(--amber); }
  .tag-prov { background: var(--amber-bg); color: var(--amber); margin-left: 0; }
  .tag-cap { background: var(--red-bg); color: var(--red); margin-left: 0; cursor: help; }
  .sum-th { min-width: 120px; }
  .ev-w-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; align-items: center; padding: 8px 10px; background: #fff; border: 1px solid var(--border); border-radius: 8px; max-width: 420px; font-size: 0.88rem; font-weight: 600; }
  .comp-on { font-size: 0.8rem; white-space: nowrap; }
  .prov-text { color: var(--amber); font-weight: 700; }
  .real-w { color: var(--amber); font-weight: 700; cursor: help; }
  .wh-ok { color: var(--green); font-weight: 600; }
  .wh-warn { color: var(--amber); font-weight: 600; }
  .wh-err { color: var(--red); font-weight: 600; }
  .sum-cell { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .sum-cell.sum-right { align-items: flex-end; }
  .ev-bars { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .help { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 0.84rem; box-shadow: var(--shadow); }
  .help summary { cursor: pointer; font-weight: 700; color: var(--navy); }
  .help ol { margin: 8px 0 2px 20px; display: flex; flex-direction: column; gap: 6px; }
  .qr-box { display: flex; justify-content: center; }
  .view-seg button { padding: 0 14px; min-width: 0; }
  .tr-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tr-th { min-width: 150px; }
  .tr-table { font-size: 0.82rem; }
  .tr-table th, .tr-table td { min-width: 0; padding: 6px 8px; position: static; }
  .tr-table td.num { text-align: center; white-space: nowrap; }
  .inc { display: inline-flex; align-items: center; gap: 6px; }
  .inc .icon-btn { min-width: 34px; min-height: 34px; font-size: 1rem; }
  .inc-n { min-width: 22px; text-align: center; font-weight: 700; }
  .btn.armed { background: var(--red); color: #fff; border-color: var(--red); }
  .badge.b-warn { background: #ffedd5; color: #c2410c; }
  .att-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .att-head input[type="date"], .tr-bar input[type="date"] { width: auto; }
  .att-list { padding: 4px 14px; }
  .att-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .att-row:last-child { border-bottom: 0; }
  .att-name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; flex: 1 1 190px; min-width: 0; }
  .att-ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .att-ctrl .seg button { min-width: 36px; padding: 0 8px; }
  .att-ctrl .btn { min-width: 40px; padding: 0 10px; }
  .btn.on-j { background: #dcfce7; border-color: #16a34a; color: #15803d; }
  .btn.on-r { background: #fef3c7; border-color: #d97706; color: #b45309; }
  .att-hist-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .att-hist { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; font-family: inherit; color: var(--text); }
  .att-hist.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .inc-types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .inc-types .btn { justify-content: flex-start; }
  .inc-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.84rem; }
  .inc-row:last-child { border-bottom: 0; }
  .abs-bar { position: relative; height: 10px; background: #e2e8f0; border-radius: 999px; margin: 10px 0 24px; }
  .abs-fill { height: 100%; border-radius: 999px; background: #16a34a; }
  .abs-fill.s1 { background: #d97706; } .abs-fill.s2 { background: #ea580c; } .abs-fill.s3 { background: #dc2626; }
  .abs-bar i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #475569; }
  .abs-bar i::after { content: attr(data-l); position: absolute; top: 14px; left: -10px; font-size: 0.66rem; color: var(--muted); font-style: normal; white-space: nowrap; }
  .secret { -webkit-text-security: disc; text-security: disc; }
  input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
  .qr-box svg { width: 240px; height: 240px; max-width: 70vw; max-height: 70vw; border: 1px solid var(--border); border-radius: 10px; padding: 6px; background: #fff; }
  .pr-warn { border: 1px solid #f59e0b; background: #fef3c7; padding: 6px 8px; font-size: 9.5pt; margin: 6px 0; }

  /* CUADERNO */
  .desktop-gradebook { display: block; }
  .mobile-gradebook { display: none; flex-direction: column; gap: 12px; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { background: #f8fafc; font-weight: 700; color: var(--navy); min-width: 170px; vertical-align: top; }
  th.sticky-col, td.sticky-col { position: sticky; left: 0; background: #fff; z-index: 2; border-right: 1px solid var(--border); min-width: 200px; }
  th.sticky-col { background: #f8fafc; z-index: 3; }
  .th-actions { display: flex; gap: 4px; flex-shrink: 0; }
  input.grade-input { width: 74px; max-width: 74px; flex-shrink: 0; padding: 6px; text-align: center; font-weight: 700; font-size: 0.95rem; min-height: 38px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; }
  input.grade-input.invalid { border-color: var(--red); background: var(--red-bg); }
  .seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
  .seg button { border: none; background: #fff; min-width: 32px; height: 38px; font-weight: 700; font-size: 0.86rem; color: var(--muted); cursor: pointer; border-right: 1px solid #e2e8f0; }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--navy); color: #fff; }
  .gb-mobile-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .gb-mobile-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .gb-act-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed #e2e8f0; }
  .gb-act-row:last-child { border-bottom: none; padding-bottom: 0; }
  .gb-act-info { min-width: 0; }
  .gb-act-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
  .gb-act-meta { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
  .gb-act-row input.grade-input { width: 78px; max-width: 78px; height: 42px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px 4px 9px; font-size: 0.76rem; font-weight: 600; }

  /* PANELES */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 1.02rem; color: var(--navy); margin-bottom: 4px; }
  .panel h3 { font-size: 0.9rem; color: var(--navy); margin: 14px 0 8px; }
  .panel p.desc { font-size: 0.83rem; color: var(--muted); margin-bottom: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .notice { background: var(--amber-bg); border: 1px solid #fcd34d; color: #78350f; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .onboard { text-align: center; padding: 26px 16px; }
  .onboard h2 { margin-bottom: 6px; }
  .onboard .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .weight-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); margin-bottom: 12px; }
  .comp-cfg { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #f8fafc; }
  .comp-cfg-grid { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .ra-cfg-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 100px auto; gap: 8px; align-items: center; padding: 8px 10px; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
  .pct { display: flex; align-items: center; gap: 4px; }
  .pct span { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .ra-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }

/* =====================================================================
   MOTOR DE CÁLCULO — idéntico en la app (index.html) y en Code.gs
   NOTA:
   - Nota de cada evaluación (1ª, 2ª, 3ª en 1º y, si tiene actividades
     normales, la ordinaria) = media ponderada de sus actividades con los
     pesos (%) que pone el profesor. Las casillas vacías no cuentan (nota
     provisional).
   - Nota final (ordinaria / extraordinaria) = media de las evaluaciones con
     los pesos de evaluación del módulo. Por defecto: 1º → 1ª, 2ª y 3ª a un
     tercio; 2º → 1ª y 2ª al 50 % (la final es tras las prácticas).
   COMPETENCIAS (semáforo y condición de aprobado):
   - Cada competencia = media ponderada (mismos pesos de actividad) de las
     actividades que la evalúan, acumulando periodos: 1EV ⊂ 2EV ⊂ ORD ⊂ EXT.
   - Recuperación: solo sustituye competencias por debajo de 5; se queda la
     mayor de (original, recuperación) y se conserva la original.
   - En la final, el módulo se supera solo si TODAS las competencias que se
     evalúan están en 5 o más y la nota final llega a 5. Con alguna
     competencia suspendida la nota queda en 4 como máximo. Si se superan
     todas gracias a recuperaciones y la media no llega a 5, sube a 5.
   - Control por RA = media de sus competencias; nota de control con el
     peso de cada RA.
   ===================================================================== */
var PERIODS = ["1EV", "2EV", "3EV", "ORD", "EXT"];
var EVALS = ["1EV", "2EV", "3EV", "ORD"];
var EV_W_DEFAULT = {
  "1": { "1EV": 33.33, "2EV": 33.33, "3EV": 33.34, "ORD": 0 },
  "2": { "1EV": 50, "2EV": 50, "3EV": 0, "ORD": 0 }
};
var RUB_DEFAULT = [2.5, 5, 7.5, 10];

function engNum(v, d) {
  var n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v).replace(",", "."));
  return isFinite(n) ? n : d;
}
function engR2(x) { return Math.round(x * 100) / 100; }
function engPeriodsUpTo(p) {
  var i = PERIODS.indexOf(p);
  return PERIODS.slice(0, i < 0 ? PERIODS.length : i + 1);
}
function engIsFinal(p) { return p === "ORD" || p === "EXT"; }
function engIsRec(a) { return !!a.rec || a.ev === "EXT"; }
function engEvalWeights(cfg) {
  var e = (cfg && cfg.ev) || {}, d = EV_W_DEFAULT[String((cfg && cfg.course) || "1")] || EV_W_DEFAULT["1"], out = {};
  EVALS.forEach(function (k) { out[k] = engNum(e[k], d[k]); });
  return out;
}
function engScore(a, g) {
  if (!g) return null;
  var rv = (Array.isArray(a.rv) && a.rv.length === 4) ? a.rv : RUB_DEFAULT;
  var fromLevel = (g.l >= 1 && g.l <= 4) ? engNum(rv[g.l - 1], null) : null;
  var fromValue = (typeof g.v === "number" && isFinite(g.v)) ? g.v : null;
  if (a.rub) return fromLevel !== null ? fromLevel : fromValue;
  return fromValue !== null ? fromValue : fromLevel;
}

/**
 * cfg:     { comps:[{id, code, weight(>0 = se evalúa), ras:[]}], ras:[{code, weight}], ev:{1EV,2EV,ORD} }
 * acts:    [{ id, ev, w, comps:[], rec, rub, rv }]
 * gradeOf: function(aid) -> {v:number} | {l:1..4} | undefined
 * period:  "1EV" | "2EV" | "ORD" | "EXT"
 */
function engCalc(cfg, acts, gradeOf, period) {
  var inc = engPeriodsUpTo(period), fin = engIsFinal(period);
  var used = acts.filter(function (a) { return inc.indexOf(a.ev) >= 0; });

  /* 1) competencias */
  var comps = (cfg.comps || []).map(function (c) {
    var ns = 0, nw = 0, rs = 0, rw = 0;
    used.forEach(function (a) {
      if ((a.comps || []).indexOf(c.id) < 0) return;
      var s = engScore(a, gradeOf(a.id));
      if (s === null) return;
      var w = engNum(a.w, 1);
      if (!(w > 0)) return;
      if (engIsRec(a)) { rs += s * w; rw += w; } else { ns += s * w; nw += w; }
    });
    var orig = nw > 0 ? engR2(ns / nw) : null;
    var rec = rw > 0 ? engR2(rs / rw) : null;
    var f = orig;
    if (rec !== null && (orig === null || orig < 5)) f = orig === null ? rec : Math.max(orig, rec);
    var weight = engNum(c.weight, 0);
    return {
      c: c, orig: orig, rec: rec, fin: f,
      st: f === null ? "none" : (f >= 5 ? "ok" : "ko"),
      recovered: f !== null && f !== orig,
      active: weight > 0, weight: weight
    };
  });
  var ok = 0, ko = 0, none = 0, activeN = 0, anyRec = false;
  comps.forEach(function (r) {
    if (!r.active) return;
    activeN++;
    if (r.st === "ok") ok++; else if (r.st === "ko") ko++; else none++;
    if (r.recovered) anyRec = true;
  });

  /* 2) nota de cada evaluación con los pesos de las actividades */
  var evGrade = {}, evCov = {};
  EVALS.forEach(function (ev) {
    if (inc.indexOf(ev) < 0) return;
    var s = 0, w = 0, tw = 0;
    acts.forEach(function (a) {
      if (a.ev !== ev || engIsRec(a)) return;
      var wa = engNum(a.w, 0);
      if (!(wa > 0)) return;
      tw += wa;
      var sc = engScore(a, gradeOf(a.id));
      if (sc === null) return;
      s += sc * wa; w += wa;
    });
    evGrade[ev] = w > 0 ? engR2(s / w) : null;
    evCov[ev] = tw > 0 ? w / tw : null;
  });

  /* 3) nota del periodo */
  var grade = null, cov = null, ew = engEvalWeights(cfg);
  if (!fin) { grade = evGrade[period] === undefined ? null : evGrade[period]; cov = evCov[period] === undefined ? null : evCov[period]; }
  else {
    var s2 = 0, w2 = 0, cs = 0, cw = 0;
    EVALS.forEach(function (ev) {
      var W = ew[ev];
      if (!(W > 0)) return;
      if (ev === "ORD" && evCov[ev] == null) return;   // sin actividades propias en la ordinaria: no cuenta
      cw += W;
      if (evCov[ev] == null) return;                   // evaluación aún sin actividades
      cs += W * evCov[ev];
      if (evGrade[ev] === null) return;
      s2 += evGrade[ev] * W; w2 += W;
    });
    grade = w2 > 0 ? engR2(s2 / w2) : null;
    cov = cw > 0 ? cs / cw : null;
  }
  var rawGrade = grade, capped = false, lifted = false, status;
  if (!fin) status = grade === null ? "none" : (grade >= 5 ? "ok" : "ko");
  else if (grade === null && ok + ko === 0) status = "none";
  else if (ko > 0) { status = "ko"; if (grade !== null && grade > 4) { grade = 4; capped = true; } }
  else if (activeN === 0 || none > 0) status = "prog";
  else if (grade !== null && grade >= 5) status = "ok";
  else if (anyRec) { status = "ok"; grade = 5; lifted = true; }
  else status = "ko";

  /* 4) control por RA */
  var ras = (cfg.ras || []).map(function (ra) {
    var a = 0, b = 0;
    comps.forEach(function (r) {
      if (!r.active || (r.c.ras || []).indexOf(ra.code) < 0 || r.fin === null) return;
      a += r.fin; b += 1;
    });
    return { ra: ra, score: b > 0 ? engR2(a / b) : null, weight: engNum(ra.weight, 0) };
  });
  var rs3 = 0, rw3 = 0;
  ras.forEach(function (x) { if (x.score !== null && x.weight > 0) { rs3 += x.score * x.weight; rw3 += x.weight; } });

  return {
    comps: comps, grade: grade, rawGrade: rawGrade, capped: capped, lifted: lifted, status: status,
    ok: ok, ko: ko, none: none, activeN: activeN, evGrade: evGrade, evCov: evCov, evW: ew, cov: cov,
    ras: ras, raGrade: rw3 > 0 ? engR2(rs3 / rw3) : null
  };
}

/* ---------- asistencia e incidencias (comunes a la app y a Code.gs) ---------- */
// Escalón de faltas: 0 = < 10 %, 1 = aviso 10 %, 2 = aviso por escrito 15 %, 3 = sin evaluación continua (20 %)
function engAbsStep(pct) { return pct >= 20 ? 3 : pct >= 15 ? 2 : pct >= 10 ? 1 : 0; }
// Puntos de CT4: 1 por incidencia + 1 por cada 1 % de horas del módulo faltadas sin justificar
function engIncPoints(nInc, unjH, H) { return nInc + (H > 0 ? Math.floor(unjH / H * 100 + 1e-9) : 0); }
function engCt4Level(pts) { return pts <= 0 ? 4 : pts <= 2 ? 3 : pts <= 4 ? 2 : 1; }
// CT1: −1 nivel desde el 3 % de horas sin justificar en la evaluación, −2 desde el 6 %
function engCt1Pen(unjH, H) { if (!(H > 0)) return 0; var p = unjH / H * 100 + 1e-9; return p >= 6 ? 2 : p >= 3 ? 1 : 0; }

/* ---------- almacenamiento (IndexedDB con respaldo en localStorage) ---------- */
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return _db;
}
async function kvGet(k) {
  const db = await idb();
  return new Promise((res, rej) => { const q = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function kvSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, "readwrite"); tx.objectStore(DB_STORE).put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}

  try { const raw = localStorage.getItem(LS_FALLBACK); if (raw) b = JSON.parse(raw); } catch (e) { /* nada */ }
  let s = a;
  if (b && (!a || (b.savedAt || 0) > (a.savedAt || 0))) s = b;

function dig(o, ...ks) { for (const k of ks) o = o[k] || (o[k] = {}); return o; }
function model() {
  if (M) return M;
  const m = { years: new Set(), stu: {}, mod: {}, act: {}, g: {}, notes: {}, def: {}, abs: {}, ses: {}, inc: {}, pr: {}, yr: {} };
  const arr = (o, k) => o[k] || (o[k] = []);
  const recs = R();
  for (const k in recs) {
    const r = recs[k];
    if (!r || r.d) continue;
    const p = k.split("|"), v = r.v || {};
    switch (p[0]) {
      case "y": m.years.add(p[1]); m.yr[p[1]] = v; break;
      case "s": if (p.length === 4) { dig(m.stu, p[1], p[2])[p[3]] = { id: p[3], n: String(v.n || "") }; m.years.add(p[1]); } break;
      case "m": if (p.length === 3 && Array.isArray(v.comps)) { dig(m.mod, p[1])[p[2]] = v; m.years.add(p[1]); } break;
      case "a": if (p.length === 4) { dig(m.act, p[1], p[2])[p[3]] = Object.assign({}, v, { id: p[3] }); m.years.add(p[1]); } break;
      case "g": if (p.length === 5) dig(m.g, p[1], p[2], p[3])[p[4]] = v; break;
      case "n": if (p.length === 4) dig(m.notes, p[1], p[2])[p[3]] = String(v.tx || ""); break;
      case "f": if (p.length === 5) arr(dig(m.abs, p[1], p[2]), p[4]).push({ d: p[3], h: engNum(v.h, 0), j: v.j ? 1 : 0, e: v.e || "" }); break;
      case "x": if (p.length === 4) dig(m.ses, p[1], p[2])[p[3]] = { h: engNum(v.h, 0), e: v.e || "" }; break;
      case "i": if (p.length === 4 && v.s) arr(dig(m.inc, p[1], p[2]), v.s).push({ id: p[3], d: String(v.d || ""), k: INC_TYPES.includes(v.k) ? v.k : "otr", tx: String(v.tx || ""), e: v.e || "", b: r.b || "" }); break;
      case "p": if (p.length === 3) dig(m.pr, p[1])[p[2]] = v; break;
    }
  }
  return (M = m);
}

function normalize100(items) {
  if (!items.length) return;
  const tot = items.reduce((a, x) => a + engNum(x.weight, 0), 0);
  items.forEach(x => { x.weight = tot > 0 ? engR2(engNum(x.weight, 0) * 100 / tot) : engR2(100 / items.length); });

}

/* ---------- sincronización con Google Sheets ---------- */
let syncing = false, syncAgain = false, syncTimer = null;
function syncConfigured() { return !!(S.conn.url && S.conn.key); }
function validUrl(u) { return /^https:\/\/script\.google(usercontent)?\.com\//.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(u); }
function scheduleSync(delay) {
  updateSyncBadge();
  if (!syncConfigured() || S.demoMode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(), delay || 5000);
}
async function apiCall(url, body) {
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(url, { method: "POST", body: JSON.stringify(body), signal: ctrl.signal, redirect: "follow" });
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new Error(t("errBadResponse")); }
    if (!data || !data.ok) throw new Error(data && data.error === "bad_key" ? t("badKey") : ((data && data.error) || "error"));
    return data;
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("timeout");
    throw e;
  } finally { clearTimeout(to); }
}
async function sync(opts = {}) {
  if (!syncConfigured() || S.demoMode) { updateSyncBadge(); return false; }
  if (syncing) { syncAgain = true; return false; }
  if (!navigator.onLine) { S.sync.lastError = t("offline"); updateSyncBadge(); if (opts.manual) showToast(t("offline")); return false; }
  clearTimeout(syncTimer);
  syncing = true; updateSyncBadge();
  const keys = Object.keys(S.pending).slice(0, SYNC_BATCH), sent = {}, records = [];
  keys.forEach(k => {
    const r = S.records[k];
    if (!r) { delete S.pending[k]; return; }
    sent[k] = r.t;
    records.push({ k, v: r.d ? null : r.v, t: r.t, b: r.b || "", d: r.d ? 1 : 0 });
  });
  const t0 = Date.now();
  let ok = false;
  try {
    const data = await apiCall(S.conn.url, { action: "sync", key: S.conn.key, teacher: S.conn.teacher, since: S.lastRev, records, app: APP_VERSION });
    const t1 = Date.now();
    if (typeof data.now === "number") S.clockOffset = Math.round(data.now - (t0 + t1) / 2);
    if (typeof data.rev === "number" && data.rev < S.lastRev) {
      S.lastRev = 0; markAllPending(); syncAgain = true; showToast(t("serverReset"));
    } else {
      let overwritten = 0, changed = 0;
      (data.records || []).forEach(rr => {
        if (!rr || typeof rr.k !== "string" || typeof rr.t !== "number") return;
        const loc = S.records[rr.k];
        if (loc && loc.t >= rr.t) {
          if (loc.t === rr.t && sent[rr.k] === loc.t) delete S.pending[rr.k];
          return;
        }
        if (loc && S.pending[rr.k] && JSON.stringify(loc.d ? null : loc.v) !== JSON.stringify(rr.d ? null : rr.v)) overwritten++;
        S.records[rr.k] = { v: rr.d ? null : rr.v, t: rr.t, b: rr.b || "", d: rr.d ? 1 : 0 };
        delete S.pending[rr.k];
        changed++;
      });
      // La respuesta rápida «sin cambios» no trae versión: solo se decide con una respuesta completa
      if (data.version) S.serverOld = !verGte(data.version, "2.4.0"); else if (records.length) S.serverOld = true;
      keys.forEach(k => { const r = S.records[k]; if (r && sent[k] === r.t && !(S.serverOld && HELD_RE.test(k))) delete S.pending[k]; });
      if (typeof data.rev === "number") S.lastRev = data.rev;
      S.sync.lastAt = Date.now(); S.sync.lastError = "";
      M = null; scheduleSave(); ok = true;
      if (changed) renderAllSafe();
      if (overwritten) showToast(t("remoteApplied", { n: overwritten }));
      if (Object.keys(S.pending).some(k => !(S.serverOld && HELD_RE.test(k)))) syncAgain = true;
    }
  } catch (e) {
    S.sync.lastError = String((e && e.message) || e);
    scheduleSave();
    if (opts.manual) showToast(t("syncErr") + ": " + S.sync.lastError);
  } finally {
    syncing = false;
    updateSyncBadge(); renderNotices();
    if ($("connModal").classList.contains("open")) renderConnInfo();
    if (!$("view-config").hidden) renderDataPanel();
    if (syncAgain && ok) { syncAgain = false; setTimeout(() => sync(), 400); } else syncAgain = false;
  }
  return ok;
}
function updateSyncBadge() {

  if (S.demoMode || !syncConfigured()) { cls = ""; txt = t("syncOff"); }

function showToast(msg, opts = {}) {
  const el = $("toast");
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (opts.undo) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t("undo");
    b.onclick = () => { el.classList.remove("show", "has-action"); opts.undo(); showToast(t("undone")); };
    el.appendChild(b); el.classList.add("has-action");
  } else el.classList.remove("has-action");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show", "has-action"), opts.undo ? 7000 : 2600);
}
function openModal(id) { $(id).classList.add("open"); }
function closeModal(id) {
  const el = $(id);
  if (!el || !el.classList.contains("open")) return;
  el.classList.remove("open");
  if (id === "studentModal") { fichaSid = null; if (!$("view-semaphore").hidden) renderSemaphore(); }
  if (needsRender && !anyModalOpen()) { needsRender = false; renderAll(); }
}
function closeTopModal() { const open = [...document.querySelectorAll(".modal-backdrop.open")]; if (open.length) closeModal(open[open.length - 1].id); }
function switchTab(tab) {
  S.ui.tab = tab;
  document.querySelectorAll(".tab-btn, .bnav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ["semaphore", "gradebook", "config"].forEach(v => { $("view-" + v).hidden = v !== tab; });
  scheduleSave();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- acciones (clic) ---------- */
const ACTIONS = {
  tab: el => switchTab(el.dataset.tab),
  toggleLang: () => { lang = lang === "es" ? "eu" : "es"; S.ui.lang = lang; scheduleSave(); applyStatic(); renderAll(); if (fichaSid) renderFicha(); showToast(t("langToast")); },
  toggleCtx: () => {
    const open = $("selectorsBar").classList.toggle("mobile-open");
    $("btnMobileContext").setAttribute("aria-expanded", open ? "true" : "false");
    $("mobileContextArrow").textContent = open ? "▴" : "▾";
  },
  closeModal: el => closeModal(el.dataset.modal),
  openStudent: el => openStudent(el.dataset.sid),
  openConn: () => openConn(null),

  /* actividades y notas */
  newAct: () => openActModal(null),
  bookView: el => { S.ui.bookView = ["tr", "att"].includes(el.dataset.v) ? el.dataset.v : "acts"; scheduleSave(); renderFilters(); renderGradebook(); },
  attSet: el => {
    const sid = el.dataset.sid, h = +el.dataset.h, d = attDate, ev = attEv();
    ensureSession(d, ev);
    const k = K.abs(d, sid), cur = getRec(k), before = absStats(sid).step;
    if (h === 0) { if (cur) del(k); } else put(k, { h, j: cur && cur.j ? 1 : 0, e: ev });
    const ses = getRec(K.ses(d));   // si falta más horas de las marcadas como clase, la sesión sube a esas horas
    if (ses && ses.h < h) put(K.ses(d), Object.assign({}, ses, { h }));
    trAuto(sid, ev);
    const after = absStats(sid);
    renderGradebook();
    if (after.step > before) absAlert(sid, after);
  },
  attDayH: el => {
    const d = attDate, ev = attEv(), h = +el.dataset.h;
    put(K.ses(d), { h, e: ev });
    students().forEach(s => { const k = K.abs(d, s.id), a = getRec(k); if (a && a.h > h) put(k, Object.assign({}, a, { h })); });
    trAutoEv(ev); renderGradebook();
  },
  attSave: () => { const ev = attEv(); put(K.ses(attDate), { h: dayHoursDefault(attDate), e: ev }); trAutoEv(ev); renderGradebook(); showToast("✓ " + t("attDone")); },
  attGo: el => { attDate = el.dataset.d; renderGradebook(); },
  absJ: el => {
    const sid = el.dataset.sid, k = K.abs(el.dataset.d, sid), cur = getRec(k);
    if (!cur) return;
    put(k, Object.assign({}, cur, { j: cur.j ? 0 : 1 }));
    trAuto(sid, cur.e); refreshAtt();
  },
  incQuick: el => {
    const sid = el.dataset.sid, d = attDate, ev = attEv();
    ensureSession(d, ev);
    const ex = incList(sid).find(x => x.d === d && x.k === "ret");
    if (ex) del(K.inc(ex.id)); else put(K.inc(uid("i")), { s: sid, d, k: "ret", e: ev });
    trAuto(sid, ev); renderGradebook();
  },
  incOpen: el => { incSid = el.dataset.sid; $("incNote").value = ""; renderIncModal(); openModal("incModal"); },
  incAdd: el => {
    const sid = incSid, d = attDate, ev = attEv(), k = el.dataset.k;
    ensureSession(d, ev);
    put(K.inc(uid("i")), { s: sid, d, k, e: ev, tx: $("incNote").value.trim().slice(0, 200) });
    $("incNote").value = "";
    trAuto(sid, ev); refreshAtt();
    showToast(t("incAdded", { k: t("inc_" + k) }));
  },
  incDel: el => {
    const k = K.inc(el.dataset.iid), cur = getRec(k);
    if (!cur) return;
    const sn = snap([k]); del(k); trAuto(cur.s, cur.e); refreshAtt();
    showToast(t("incDeleted"), { undo: () => { restore(sn); trAuto(cur.s, cur.e); refreshAtt(); } });
  },
  prRecalc: () => {
    if (!confirm(t("prRecalcQ"))) return;
    students().forEach(s => { if (getRec(K.pr(s.id))) del(K.pr(s.id)); });
    ACTIONS.openTrGroup();
  },
  trActivate: () => {
    const w = parsePct($("trWNew").value);
    if (!(w >= 1 && w <= 50)) return showToast(t("trWBad"));
    ensureCfg();
    const all = acts(), evs = evalsFor();
    const full = evs.filter(ev => Math.abs(evalSum(all, ev) - 100) < 0.5);
    if (full.length && confirm(t("trScaleQ", { r: fmt(100 - w), w: fmt(w) }))) {
      const f = (100 - w) / 100;
      full.forEach(ev => normalActs(all, ev).filter(a => !a.tr).forEach(a => { const v = Object.assign({}, a); delete v.id; v.w = engR2(engNum(a.w, 0) * f); put(K.act(a.id), v); }));
    }
    evs.forEach((ev, j) => {
      TRANSVERSALS.forEach((ct, i) => put(K.act(`tr-${ev}-${ct.code}`), trActData(ev, ct, w, j * 10 + i)));
      put(K.act(`tr-${ev}-INC`), incActData(ev));
    });
    trAutoAll(); renderAll(); showToast(t("trActivated"));
  },
  trDeactivate: () => {
    if (!confirm(t("trDeactQ"))) return;
    const keys = acts().filter(a => a.tr).map(a => K.act(a.id)), sn = snap(keys);
    keys.forEach(k => del(k)); renderAll();
    showToast(t("trDeactDone"), { undo: () => { restore(sn); renderAll(); } });
  },
  openTrGroup: () => {
    const evs = trEvsUpTo();
    const one = S.ui.course === "1", cut = prCut();
    const rows = students().map(s => { const r = trDeptRows(s.id, evs); return { label: s.n, v: trMeanRow(r), n: r.filter(x => TRANSVERSALS.some(ct => x.v[ct.code] !== null)).length, x: one ? prBadge(prState(s.id)) : "" }; });
    $("trGroupBody").innerHTML = `<p class="small muted">${esc(t("trDeptDesc", { p: t("p_" + curPeriod()) }))}</p>`
      + (one ? `<div class="panel" style="padding:10px 12px;margin:8px 0;box-shadow:none"><div class="tr-bar"><strong class="small">${esc(t("prTitle"))}</strong><span class="small">${esc(t("prCut"))}</span><input type="date" value="${esc(cut)}" data-ch="prCut" style="width:auto"><button type="button" class="btn btn-sm" data-act="prRecalc">${esc(t("prRecalc"))}</button></div><p class="small muted" style="margin-top:6px">${esc(t("prRule", { d: cut ? fmtDay(cut) : t("prNoCut") }))}</p></div>` : "")
      + (rows.some(r => r.n > 0) ? trTableHtml(rows, t("student"), true, null, one ? t("prTitle") : null) : `<p class="small">${esc(t("trNoData"))}</p>`);
    openModal("trGroupModal");
  },
  editAct: el => openActModal(el.dataset.aid),
  pillToggle: el => { el.classList.toggle("selected"); if (el.closest("#actCompPills")) updateActHelp(); },
  saveAct: () => {
    const ti = $("actTitle").value.trim().slice(0, 160);
    if (!ti) return showToast(t("needTitle"));
    const w = parsePct($("actWeight").value);
    if (!(w > 0) || w > 100) return showToast(t("badWeight"));
    const comps = [...document.querySelectorAll("#actCompPills .ra-pill.selected")].map(el => el.dataset.cid);
    if (!comps.length) return showToast(t("needComp"));
    const ev = $("actEval").value, rub = $("actRub").checked;
    let rv = RUB_DEFAULT.slice();
    if (rub) {
      rv = [1, 2, 3, 4].map(i => parseNum($("rv" + i).value));
      if (rv.some(x => !(x >= 0 && x <= 10))) return showToast(t("badRub"));
      rv = rv.map(engR2);
    }
    ensureCfg();
    const old = editingAid ? getRec(K.act(editingAid)) : null;
    const aid = editingAid || uid("a");
    const isRec = ev === "EXT" ? true : $("actRec").checked;
    put(K.act(aid), { ti, ev, w: engR2(w), comps, rec: isRec, rub, rv, o: old && old.o ? old.o : Date.now() });
    closeModal("activityModal"); renderAll();
    const s = evalSum(acts(), ev);
    showToast(isRec || Math.abs(s - 100) < 0.5 ? t("actSaved") : t(s > 100 ? "actSavedOver" : "actSavedUnder", { p: t("p_" + ev), s: fmt(s), d: fmt(Math.abs(100 - s)) }));
  },
  delAct: el => {
    const k = K.act(el.dataset.aid), sn = snap([k]);
    del(k); renderAll();
    showToast(t("actDeleted"), { undo: () => { restore(sn); renderAll(); } });
  },
  rubSet: el => {
    const sid = el.dataset.sid, aid = el.dataset.aid, l = +el.dataset.l, k = K.grade(aid, sid), cur = getRec(k);
    const a = acts().find(x => x.id === aid);
    if (a && a.tr === "CT1") { if (cur && (cur.b || cur.l) === l) del(k); else { put(k, { l, b: l }); trAuto(sid, a.ev); } }
    else if (cur && cur.l === l) del(k); else put(k, { l });
    afterGrade(sid, aid);
    if (S.ui.bookView === "tr" && !$("view-gradebook").hidden) renderGradebook();
  },

  /* competencias y RA */
  addComp: () => {
    const c = ensureCfg(), nums = c.comps.map(x => parseInt(String(x.code).replace(/\D/g, ""), 10) || 0);
    c.comps.push({ id: uid("c"), code: "C" + (Math.max(0, ...nums) + 1), es: I18N.es.newCompText, eu: I18N.eu.newCompText, weight: 1, ras: c.ras.length ? [c.ras[0].code] : [] });
    saveCfg(c); renderAll(); showToast(t("compAdded"));
  },
  delComp: el => {
    const c = ensureCfg();
    if (c.comps.length <= 1) return showToast(t("minOneComp"));
    const sn = snap([K.mod()]);
    c.comps = c.comps.filter(x => x.id !== el.dataset.cid);
    saveCfg(c); renderAll();
    showToast(t("compDeleted"), { undo: () => { restore(sn); renderAll(); } });
  },
  toggleCompRa: el => {
    const c = ensureCfg(), x = c.comps.find(q => q.id === el.dataset.cid);
    if (!x) return;
    x.ras = x.ras || [];
    x.ras = x.ras.includes(el.dataset.ra) ? x.ras.filter(r => r !== el.dataset.ra) : x.ras.concat(el.dataset.ra);
    saveCfg(c); preserveFocus(renderAll);
  },
  balanceComps: () => { const c = ensureCfg(); normalize100(c.comps); saveCfg(c); renderAll(); showToast(t("balanced")); },
  balanceEvs: () => {
    const c = ensureCfg(), ew = engEvalWeights(c), evs = shownEvals(c);
    const items = evs.map(ev => ({ ev, weight: ew[ev] }));
    normalize100(items);
    c.ev = Object.assign({}, ew); items.forEach(x => { c.ev[x.ev] = x.weight; });
    saveCfg(c); renderAll(); showToast(t("balanced"));
  },
  addRa: () => {
    const c = ensureCfg(), nums = c.ras.map(x => parseInt(String(x.code).replace(/\D/g, ""), 10) || 0);
    c.ras.push({ code: "RA" + (Math.max(0, ...nums) + 1), weight: 0, es: I18N.es.newRaText, eu: I18N.eu.newRaText });
    saveCfg(c); renderAll();
  },
  delRa: el => {
    const c = ensureCfg();
    if (c.ras.length <= 1) return showToast(t("minOneRa"));
    const sn = snap([K.mod()]), code = el.dataset.ra;
    c.ras = c.ras.filter(r => r.code !== code);
    c.comps.forEach(x => { x.ras = (x.ras || []).filter(r => r !== code); });
    saveCfg(c); renderAll();
    showToast(t("raDeleted"), { undo: () => { restore(sn); renderAll(); } });
  },
  balanceRas: () => { const c = ensureCfg(); normalize100(c.ras); saveCfg(c); renderAll(); showToast(t("balanced")); },
  resetModule: () => {
    if (!confirm(t("confirmReset"))) return;
    const sn = snap([K.mod()]);
    put(K.mod(), defaultCfg(S.ui.module)); renderAll();
    showToast(t("resetDone"), { undo: () => { restore(sn); renderAll(); } });
  },

  /* alumnado */
  openAddStudent: () => { $("singleStudentName").value = ""; openModal("studentAddModal"); setTimeout(() => $("singleStudentName").focus(), 60); },
  saveStudent: () => {
    const n = cleanName($("singleStudentName").value);
    if (!n) return showToast(t("nameNeeded"));
    if (students().some(s => norm(s.n) === norm(n))) return showToast(t("stuExists"));
    put(K.stu(uid("s")), { n });
    closeModal("studentAddModal"); renderAll(); showToast(t("stuAdded", { n }));
  },
  openBulk: () => { $("bulkText").value = ""; openModal("bulkModal"); setTimeout(() => $("bulkText").focus(), 60); },
  saveBulk: () => {
    const lines = $("bulkText").value.split(/\r?\n/).map(cleanName).filter(Boolean);
    if (!lines.length) return showToast(t("pasteAtLeastOne"));
    const ex = new Set(students().map(s => norm(s.n)));
    let added = 0, dup = 0;
    lines.forEach(n => { const k = norm(n); if (ex.has(k)) { dup++; return; } ex.add(k); put(K.stu(uid("s")), { n }); added++; });
    closeModal("bulkModal"); renderAll();
    showToast(t("stuImported", { n: added }) + (dup ? t("stuDupSkipped", { n: dup }) : ""));
  },
  delStudent: el => {
    if (el.dataset.armed !== "1") {   // primer clic: pide confirmación; el segundo (en 4 s) da de baja
      el.dataset.armed = "1"; el.dataset.label = el.textContent; el.textContent = t("confirmDrop"); el.classList.add("armed");
      setTimeout(() => { if (el.isConnected && el.dataset.armed === "1") { el.dataset.armed = ""; el.textContent = el.dataset.label; el.classList.remove("armed"); } }, 4000);
      return;
    }
    const k = K.stu(el.dataset.sid), sn = snap([k]), name = (getRec(k) || {}).n || "";
    del(k); renderAll();
    showToast(t("stuRemoved", { n: name }), { undo: () => { restore(sn); renderAll(); } });
  },

  /* curso nuevo y promoción */
  openNewYear: () => {
    const ns = (parseInt(S.ui.year.split("-")[0], 10) || new Date().getFullYear()) + 1;
    $("newYearInput").value = `${ns}-${ns + 1}`;
    $("nyCopyActs").checked = true;
    const s1 = students(S.ui.year, "1"), s2 = students(S.ui.year, "2");
    const sel = (sid, opts) => `<select data-promo="${esc(sid)}">${opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select>`;
    const block = (title, list, opts) => `<h3 style="font-size:0.88rem;color:var(--navy);margin:6px 0;">${esc(title)}</h3>` + (list.length ? list.map(s => `<div class="promo-row"><span>${esc(s.n)}</span>${sel(s.id, opts)}</div>`).join("") : `<p class="small muted">${esc(t("nyNone"))}</p>`);
    $("nyStudents").innerHTML = block(t("ny1"), s1, [["p", t("optPromote")], ["r", t("optRepeat1")], ["x", t("optLeave")]])
      + block(t("ny2"), s2, [["f", t("optFinish")], ["s", t("optStay2")]]);
    openModal("newYearModal");
  },
  createYear: () => {
    const ny = cleanName($("newYearInput").value);
    if (!ny || ny.includes("|") || ny.length > 20) return showToast(t("nyInvalid"));
    const m = model(), cy = S.ui.year;
    if (m.years.has(ny)) return showToast(t("nyExists"));
    const s1 = (m.stu[cy] || {})["1"] || {}, s2 = (m.stu[cy] || {})["2"] || {};
    const modCopy = clone(m.mod[cy] || {}), actCopy = clone(m.act[cy] || {});
    put(K.year(ny), { n: ny });
    document.querySelectorAll("#nyStudents select[data-promo]").forEach(sel => {
      const sid = sel.dataset.promo, name = (s1[sid] || s2[sid] || {}).n;
      if (!name) return;
      if (sel.value === "p" || sel.value === "s") put(`s|${ny}|2|${sid}`, { n: name });
      else if (sel.value === "r") put(`s|${ny}|1|${sid}`, { n: name });
    });
    Object.keys(modCopy).forEach(code => put(`m|${ny}|${code}`, modCopy[code]));
    if ($("nyCopyActs").checked) {
      Object.keys(actCopy).forEach(code => {
        Object.values(actCopy[code]).forEach(a => { const v = Object.assign({}, a); delete v.id; put(`a|${ny}|${code}|${a.id}`, v); });
        if (!modCopy[code]) put(`m|${ny}|${code}`, defaultCfg(code));
      });
    }
    S.ui.year = ny; S.ui.period = null;
    closeModal("newYearModal"); renderAll(); showToast(t("nyDone", { y: ny }));
  },

  /* exportar e imprimir */
  exportCsv: () => {
    const p = curPeriod(), c = cfg(), as = acts(), gm = gradeMap();
    const cell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const n = x => (x === null || x === undefined || !isFinite(x)) ? "" : String(engR2(x)).replace(".", ",");
    const evCols = EVALS.filter(ev => evalsFor().includes(ev) || normalActs(as, ev).length), fp = finalPeriod(as);
    const head = [t("year"), t("group"), t("module"), t("period"), t("student")]
      .concat(as.map(a => `${a.ti} [${t("ps_" + a.ev)} · ${engIsRec(a) ? t("tagRec") : fmt(engNum(a.w, 0)) + "%"}]`))
      .concat(c.comps.map(x => `${x.code} (${(x.ras || []).join("/")})`))
      .concat(c.ras.map(r => `${r.code} ${fmt(engNum(r.weight, 0))}%`))
      .concat(evCols.map(ev => `${t("evalGrade")} ${t("ps_" + ev)}`))
      .concat([t(isFinal(p) ? "finalGrade" : "evalGrade") + " (" + t("p_" + p) + ")", t("corrected"), t("raControl"), t("status"), t("notes")]);
    const rows = students().map(s => {
      const r = calcFor(s.id, p, c, as), rF = calcFor(s.id, fp, c, as);
      return [S.ui.year, t("course" + S.ui.course), modName(S.ui.module), t("p_" + p), s.n]
        .concat(as.map(a => n(engScore(a, (gm[a.id] || {})[s.id]))))
        .concat(r.comps.map(x => n(x.fin))).concat(r.ras.map(x => n(x.score)))
        .concat(evCols.map(ev => n(rF.evGrade[ev])))
        .concat([n(r.grade), r.grade === null ? "" : (covPct(r) ?? ""), n(r.raGrade), statusLabel(r.status, p) + (r.capped ? " (máx. 4)" : ""), noteOf(s.id)]);
    });
    download(`Easo_PE_${S.ui.course}_${S.ui.module}_${S.ui.year}_${p}.csv`, "﻿" + [head].concat(rows).map(r => r.map(cell).join(";")).join("\r\n"), "text/csv;charset=utf-8");
    showToast(t("csvDone"));
  },
  printActa: () => {
    const p = curPeriod(), c = cfg(), as = acts(), fin = isFinal(p);
    const evCols = fin ? EVALS.filter(ev => normalActs(as, ev).length) : [];
    let anyRec = false, nProv = 0, anyCap = false, anyLift = false, anyNoEC = false;
    const H = modHours();
    const rows = students().map((s, i) => {
      const r = calcFor(s.id, p, c, as), cv = r.grade === null ? null : covPct(r);
      if (isProv(cv)) nProv++;
      if (r.capped) anyCap = true;
      if (r.lifted) anyLift = true;
      return `<tr><td class="num">${i + 1}</td><td>${esc(s.n)}</td>${r.comps.map(x => { if (x.recovered) anyRec = true; return `<td class="num">${x.active ? fmt(x.fin) + (x.recovered ? "*" : "") : "—"}</td>`; }).join("")}`
        + evCols.map(ev => `<td class="num">${fmt(r.evGrade[ev])}</td>`).join("")
        + `<td class="num"><b>${fmt(r.grade)}</b>${r.capped ? " ‡" : ""}${r.lifted ? " §" : ""}${isProv(cv) ? " †" : ""}</td><td class="num">${cv === null ? "—" : cv + " %"}</td><td>${esc(statusLabel(r.status, p))}</td>${H > 0 ? (() => { const a = absStats(s.id); if (a.step === 3) anyNoEC = true; return `<td class="num">${a.tot ? fmt(a.pct) + " %" + (a.step === 3 ? " ¶" : "") : "—"}</td>`; })() : ""}</tr>`;
    }).join("");
    const legend = c.comps.map(x => `<div><b>${esc(x.code)}</b> (${esc((x.ras || []).join(", "))})${engNum(x.weight, 0) > 0 ? "" : " · " + esc(t("c_off"))}: ${esc(compLabel(x))}</div>`).join("");
    const extra = [anyRec ? t("recLegend") : "", anyCap ? t("capLegend") : "", anyLift ? t("liftLegend") : "", nProv ? t("provLegend") : "", anyNoEC ? t("noEcLegend") : "", fin ? t("compRule") : ""].filter(Boolean).map(x => `<div style="margin-top:4px">${esc(x)}</div>`).join("");
    doPrint(printHeader(t("actaTitle")) + (nProv ? `<div class="pr-warn">⚠️ ${esc(t("actaProvWarn", { n: nProv }))}</div>` : "")
      + `<table class="pr-table"><thead><tr><th>Nº</th><th>${esc(t("student"))}</th>${c.comps.map(x => `<th>${esc(x.code)}</th>`).join("")}${evCols.map(ev => `<th>${esc(t("ps_" + ev))}</th>`).join("")}<th>${esc(t(fin ? "finalGrade" : "evalGrade"))}</th><th>${esc(t("corrected"))}</th><th>${esc(t("status"))}</th>${H > 0 ? `<th>${esc(t("absCol"))}</th>` : ""}</tr></thead><tbody>${rows}</tbody></table>`
      + `<div class="pr-legend">${legend}${extra}</div><div class="pr-sign"><div>${esc(t("signature"))}</div></div>`);
  },
  printFicha: () => {
    const s = students().find(x => x.id === fichaSid);
    if (!s) return;
    const p = curPeriod(), c = cfg(), as = acts(), gm = gradeMap(), r = calcFor(s.id, p, c, as);
    const rF = calcFor(s.id, finalPeriod(as), c, as);
    const comps = r.comps.map(x => `<tr><td><b>${esc(x.c.code)}</b> · ${esc(compLabel(x.c))}</td><td class="num">${esc((x.c.ras || []).join(", "))}</td><td class="num">${fmt(x.orig)}</td><td class="num">${fmt(x.rec)}</td><td class="num"><b>${fmt(x.fin)}</b></td><td>${esc(x.active ? t("c_" + x.st) : t("c_off"))}</td></tr>`).join("");
    const actsT = as.map(a => `<tr><td>${esc(a.ti)}</td><td>${esc(t("p_" + a.ev))}${engIsRec(a) ? " · " + esc(t("tagRec")) : ""}</td><td class="num">${fmt(engScore(a, (gm[a.id] || {})[s.id]))}</td></tr>`).join("");
    const ras = r.ras.map(x => `<tr><td><b>${esc(x.ra.code)}</b> · ${esc(raLabel(x.ra))}</td><td class="num">${fmt(x.weight)} %</td><td class="num">${fmt(x.score)}</td></tr>`).join("");
    const note = noteOf(s.id);
    doPrint(printHeader(t("fichaTitle"), `<div style="grid-column:1/-1"><b>${esc(t("student"))}:</b> ${esc(s.n)} · <b>${esc(t(isFinal(p) ? "finalGrade" : "evalGrade"))}:</b> ${fmt(r.grade)} (${esc(statusLabel(r.status, p))}${r.capped ? " · " + esc(t("cappedTag")) : ""}) · ${esc(evGradesLine(rF))} · <b>${esc(t("finalGrade"))}:</b> ${fmt(rF.grade)} · <b>${esc(t("raControl"))}:</b> ${fmt(r.raGrade)}</div>`)
      + `<table class="pr-table"><thead><tr><th>${esc(t("fichaSec1").replace(/^1\.\s*/, ""))}</th><th>RA</th><th>Orig.</th><th>Rec.</th><th>${esc(t("grade"))}</th><th>${esc(t("status"))}</th></tr></thead><tbody>${comps}</tbody></table>`
      + `<table class="pr-table"><thead><tr><th>${esc(t("activities"))}</th><th>${esc(t("period"))}</th><th>${esc(t("grade"))}</th></tr></thead><tbody>${actsT || `<tr><td colspan="3">${esc(t("noActsShort"))}</td></tr>`}</tbody></table>`
      + `<table class="pr-table"><thead><tr><th>RA</th><th>${esc(t("weight"))}</th><th>${esc(t("grade"))}</th></tr></thead><tbody>${ras}</tbody></table>`
      + (note ? `<div class="pr-legend"><b>${esc(t("notes"))}:</b> ${esc(note)}</div>` : "")
      + `<div class="pr-sign"><div>${esc(t("signature"))}</div></div>`);
  },

  /* conexión */
  toggleKey: () => { $("connKey").classList.toggle("secret"); },
  clearSearch: () => { $("searchStudent").value = ""; renderSemaphore(); },
  showAll: () => { statusFilter = "all"; renderFilters(); renderSemaphore(); },
  testConn: async () => {
    const url = $("connUrl").value.trim(), key = $("connKey").value.trim();
    if (!url || !key) return setConnStatus(t("needUrlKey"), true);
    if (!validUrl(url)) return setConnStatus(t("badUrl"), true);
    setConnStatus(t("testing"));
    try { const d = await apiCall(url, { action: "ping", key }); setConnStatus(t("testOk", { n: d.count || 0 })); }
    catch (e) { setConnStatus(t("errConn", { e: (e && e.message) || e }), true); }
  },
  saveConn: async () => {
    const url = $("connUrl").value.trim(), key = $("connKey").value.trim(), teacher = cleanName($("connTeacher").value).slice(0, 40);
    if (!teacher) return setConnStatus(t("needTeacher"), true);
    if (!url || !key) return setConnStatus(t("needUrlKey"), true);
    if (!validUrl(url)) return setConnStatus(t("badUrl"), true);
    if (S.demoMode) ACTIONS.demoOff();
    const urlChanged = url !== S.conn.url;
    S.conn = { url, key, teacher };
    S.sync.lastError = "";
    if (urlChanged) { S.lastRev = 0; markAllPending(); }
    await saveNow();
    setConnStatus(t("syncing"));
    const ok = await sync({ manual: false });
    if (ok) { closeModal("connModal"); showToast(t("syncDone")); renderAll(); }
    else setConnStatus(t("errConn", { e: S.sync.lastError }), true);
  },
  openInvite: () => {
    if (!syncConfigured()) return;
    const link = inviteLink();
    $("inviteLink").value = link;
    let svg = "";
    try { const q = qrcode(0, "M"); q.addData(link); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { svg = ""; }
    $("inviteQr").innerHTML = svg; $("inviteQr").hidden = !svg;
    $("btnShareInvite").hidden = !navigator.share;
    closeModal("connModal"); openModal("inviteModal");
  },
  copyInvite: async () => {
    const v = $("inviteLink").value;
    try { await navigator.clipboard.writeText(v); }
    catch (e) { $("inviteLink").select(); try { document.execCommand("copy"); } catch (e2) { /* nada */ } }
    showToast(t("invCopied"));
  },
  shareInvite: async () => {
    try { await navigator.share({ title: t("invShareTitle"), text: t("invShareText"), url: $("inviteLink").value }); } catch (e) { /* cancelado */ }
  },
  disconnect: () => {
    S.conn.url = ""; S.conn.key = ""; S.lastRev = 0; S.sync.lastError = "";
    scheduleSave(); closeModal("connModal"); renderAll(); showToast(t("disconnected"));
  },
  syncNow: async () => { const ok = await sync({ manual: true }); if (ok) showToast(t("syncDone")); },

  /* copias y datos */
  exportJson: () => download(`easo-competencias-copia_${stamp()}.json`, JSON.stringify({ app: "easo-competencias", schema: 2, version: APP_VERSION, exportedAt: new Date().toISOString(), teacher: S.conn.teacher, records: S.records }), "application/json"),
  importJson: () => $("fileImport").click(),
  restoreSnap: async () => {
    let sn = null;
    try { sn = await kvGet("snapshot"); } catch (e) { /* nada */ }
    if (!sn || !sn.records) { S.snapAt = 0; renderAll(); return; }
    const cur = S.records, keys = new Set(Object.keys(cur).concat(Object.keys(sn.records)));
    keys.forEach(k => {
      const a = cur[k], b = sn.records[k];
      const av = a && !a.d ? JSON.stringify(a.v) : null, bv = b && !b.d ? JSON.stringify(b.v) : null;
      if (av === bv) return;
      if (bv === null) del(k); else put(k, b.v);
    });
    S.snapAt = 0;
    try { await kvSet("snapshot", null); } catch (e) { /* nada */ }
    renderAll(); showToast(t("snapRestored"));
  },
  importOld: async () => {
    const o = oldData();
    if (!o) return;
    if (S.demoMode) ACTIONS.demoOff();
    await takeSnapshot();
    migrateOld(o);
    S.oldHandled = true; scheduleSave(); renderAll(); showToast(t("oldImported"));
  },
  discardOld: () => { S.oldHandled = true; scheduleSave(); renderNotices(); },
  demoOn: () => {
    if (!S.demoMode) S.uiBackup = clone(S.ui);
    S.demoMode = true; S.demoRecords = makeDemo(); M = null;
    S.ui.period = null; scheduleSave(); renderAll();
  },
  demoOff: () => {
    S.demoMode = false; S.demoRecords = null; M = null;
    if (S.uiBackup) { S.ui = Object.assign(S.ui, S.uiBackup); S.uiBackup = null; }
    scheduleSave(); renderAll();
  },
  clearLocal: async () => {
    const pend = Object.keys(S.pending).length;
    if (!confirm(t("confirmClear") + (pend ? "\n\n" + t("pendingWarn", { n: pend }) : ""))) return;
    await takeSnapshot();
    S.records = {}; S.pending = {}; S.lastRev = 0; M = null;
    await saveNow(); renderAll(); showToast(t("cleared"));
    if (syncConfigured()) sync();
  },
  installApp: async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) { /* nada */ }
    deferredInstall = null; renderDataPanel();
  }
};

/* ---------- cambios (inputs y selects) ---------- */
const CHANGES = {
  year: el => { S.ui.year = el.value; S.ui.period = null; fichaSid = null; scheduleSave(); renderAll(); },
  course: el => { S.ui.course = el.value; S.ui.period = null; S.ui.evalFilter = "ALL"; scheduleSave(); renderAll(); },
  module: el => { S.ui.module = el.value; S.ui.period = null; scheduleSave(); renderAll(); },
  period: el => { S.ui.period = el.value; scheduleSave(); renderAll(); },
  statusFilter: el => { statusFilter = el.value; renderSemaphore(); },
  trEv: el => { S.ui.trEv = el.value; scheduleSave(); renderGradebook(); },
  attDate: el => { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { attDate = el.value; renderGradebook(); } },
  attEv: el => {
    const ev = el.value, d = attDate, cur = getRec(K.ses(d)), old = cur && cur.e;
    S.ui.attEv = ev; scheduleSave();
    if (cur && old !== ev) {
      put(K.ses(d), Object.assign({}, cur, { e: ev }));
      students().forEach(s => {
        const k = K.abs(d, s.id), a = getRec(k); if (a) put(k, Object.assign({}, a, { e: ev }));
        incList(s.id).filter(x => x.d === d).forEach(x => { const ki = K.inc(x.id); put(ki, Object.assign({}, getRec(ki), { e: ev })); });
      });
      trAutoEv(ev); if (old) trAutoEv(old);
    }
    renderGradebook();
  },
  modHours: el => {
    const v = parseNum(el.value);
    if (!(v >= 0 && v <= 2000)) { showToast(t("badHours")); rerender(); return; }
    const c = ensureCfg(); c.hrs = Math.round(v); saveCfg(c); trAutoAll(); showToast("✓ " + t("cfgHoursSaved")); rerender();
  },
  prCut: el => {
    const y = S.ui.year;
    put(K.year(y), Object.assign({ n: y }, getRec(K.year(y)) || {}, { cut: /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : "" }));
    ACTIONS.openTrGroup();
  },
  trW: el => {
    const w = parsePct(el.value);
    if (!(w >= 1 && w <= 50)) { showToast(t("trWBad")); rerender(); return; }
    acts().filter(a => a.tr && a.tr !== "INC").forEach(a => { const v = Object.assign({}, a); delete v.id; v.w = engR2(w / 5); put(K.act(a.id), v); });
    showToast(t("trWSaved")); rerender();
  },
  evalFilter: el => { S.ui.evalFilter = el.value; scheduleSave(); renderGradebook(); },
  evW: el => {
    const n = parsePct(el.value);
    if (!isFinite(n) || n < 0 || n > 100) { showToast(t("badPct")); rerender(); return; }
    const c = ensureCfg();
    c.ev = Object.assign(engEvalWeights(c), { [el.dataset.ev]: engR2(n) });
    saveCfg(c); rerender();
  },
  compActive: el => {
    const c = ensureCfg(), x = c.comps.find(q => q.id === el.dataset.cid);
    if (!x) return;
    x.weight = el.checked ? (engNum(x.weight, 0) > 0 ? x.weight : 1) : 0;
    saveCfg(c); rerender();
  },
  compField: el => {
    const c = ensureCfg(), x = c.comps.find(q => q.id === el.dataset.cid);
    if (!x) return;
    const f = el.dataset.field, v = el.value.trim();
    if (f === "weight") { const n = parsePct(v); if (!isFinite(n) || n < 0 || n > 100) { showToast(t("badPct")); rerender(); return; } x.weight = engR2(n); }
    else if (f === "code") { if (v) x.code = v.slice(0, 10); }
    else if (v) x[f] = v.slice(0, 240);
    saveCfg(c); rerender();
  },
  raField: el => {
    const c = ensureCfg(), r = c.ras.find(q => q.code === el.dataset.ra);
    if (!r) return;
    const f = el.dataset.field, v = el.value.trim();
    if (f === "weight") { const n = parsePct(v); if (!isFinite(n) || n < 0 || n > 100) { showToast(t("badPct")); rerender(); return; } r.weight = engR2(n); }
    else if (v) r[f] = v.slice(0, 300);
    saveCfg(c); rerender();
  },
  stuName: el => {
    const n = cleanName(el.value), k = K.stu(el.dataset.sid);
    if (n && getRec(k)) put(k, { n });
    rerender();
  },
  note: el => {
    const v = el.value.trim().slice(0, 2000), k = K.note(el.dataset.sid);
    if (v) put(k, { tx: v }); else del(k);
    showToast(t("noteSaved"));
  },
  teacher: el => { S.conn.teacher = cleanName(el.value).slice(0, 40); scheduleSave(); updateSyncBadge(); },
  actEval: () => {
    const wi = $("actWeight");
    if (wi.dataset.auto) { const rest = engR2(100 - evalSum(acts(), $("actEval").value, editingAid)); wi.value = rest > 0 ? fmtIn(rest) : ""; }
    if (!editingAid && !$("actRec").disabled) $("actRec").checked = $("actEval").value === "ORD";
    syncActModal();
  },
  actRec: () => updateActHelp(),
  actRub: () => syncActModal(),
  importFile: async el => {
    const f = el.files && el.files[0];
    el.value = "";
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { return showToast(t("importBad")); }
    if (S.demoMode) ACTIONS.demoOff();
    let n = 0;
    if (data && data.app === "easo-competencias" && data.records && typeof data.records === "object") {
      await takeSnapshot();
      Object.keys(data.records).forEach(k => {
        const inc = data.records[k];
        if (!inc || typeof inc.t !== "number" || !/^[ysmagn]\|/.test(k)) return;
        const loc = S.records[k];
        if (!loc || inc.t > loc.t) { S.records[k] = { v: inc.d ? null : inc.v, t: inc.t, b: inc.b || "", d: inc.d ? 1 : 0 }; S.pending[k] = 1; n++; }
      });
      M = null; scheduleSave(); scheduleSync(1000);
    } else if (data && data.years) {
      await takeSnapshot();
      n = migrateOld(data);
    } else return showToast(t("importBad"));
    renderAll(); showToast(t("importDone", { n }));
  }
};

/* ---------- eventos globales ---------- */
function bindGlobal() {
  document.addEventListener("click", e => {
    if (e.target.classList && e.target.classList.contains("modal-backdrop")) { closeModal(e.target.id); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("grade-input")) { commitGradeInput(el); return; }
    const ch = el.dataset && el.dataset.ch;
    if (ch && CHANGES[ch]) CHANGES[ch](el, e);
  });
  document.addEventListener("input", e => {
    if (e.target.dataset && e.target.dataset.in === "search") renderSemaphore();
    if (e.target.id === "actWeight") { e.target.dataset.auto = ""; updateActHelp(); }
    if (e.target.id === "connUrl") {
      const inv = inviteFromText(e.target.value);
      if (inv) { e.target.value = inv.u; $("connKey").value = inv.k; setConnStatus(t("invPasted")); }
    }
  });
  document.addEventListener("toggle", e => { if (e.target.id === "bookHelp") helpOpen = e.target.open; if (e.target.id === "trLegend") trLegendOpen = e.target.open; }, true);
  document.addEventListener("keydown", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("grade-input")) {
      if (e.key === "Enter") { e.preventDefault(); if (commitGradeInput(el)) focusNextGrade(el, e.shiftKey ? -1 : 1); }
      else if (e.key === "Escape") {
        e.stopPropagation();
        const a = acts().find(x => x.id === el.dataset.aid);
        el.value = a ? fmtIn(engScore(a, gradeOf(el.dataset.aid, el.dataset.sid))) : "";
        el.classList.remove("invalid"); el.blur();
      }
      return;
    }
    if (e.key === "Escape") { closeTopModal(); return; }
    if (e.key === "Enter" && !e.shiftKey) {
      const map = { singleStudentName: "saveStudent", newYearInput: "createYear", connKey: "saveConn", connTeacher: "saveConn" };
      if (map[el.id]) { e.preventDefault(); ACTIONS[map[el.id]](); }
    }
  });
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("grade-input")) { try { el.select(); } catch (er) { /* nada */ } el.dataset.jf = "1"; }
  });
  document.addEventListener("mouseup", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("grade-input") && el.dataset.jf) { e.preventDefault(); delete el.dataset.jf; }
  });
  document.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.jf) delete e.target.dataset.jf; }, true);
  document.addEventListener("focusout", () => setTimeout(() => {
    if (needsRender && !isEditing() && !anyModalOpen()) { needsRender = false; preserveFocus(renderAll); }
  }, 60));
  window.addEventListener("online", () => { updateSyncBadge(); sync(); });
  window.addEventListener("offline", updateSyncBadge);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { saveSync(); saveNow(); if (Object.keys(S.pending).length) sync(); }
    else if (Date.now() - (S.sync.lastAt || 0) > 60000) sync();
  });
  window.addEventListener("pagehide", () => { saveSync(); saveNow(); });
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (!$("view-config").hidden) renderDataPanel(); });
}
function registerSW() {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sin SW: la app funciona igual */ });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { /* nada */ });
}

async function init() {
  S = await loadState();
  lang = S.ui.lang === "eu" ? "eu" : "es";
  if (!CURRICULUM[S.ui.course]) S.ui.course = "1";
  applyStatic();
  $("searchStudent").value = "";
  bindGlobal();
  switchTab(["semaphore", "gradebook", "config"].includes(S.ui.tab) ? S.ui.tab : "semaphore");
  registerSW();
  checkInviteInUrl();
  window.addEventListener("hashchange", checkInviteInUrl);
  S.serverOld = false;
  if (syncConfigured()) sync();
  setInterval(() => { if (document.visibilityState === "visible") sync(); }, 120000);
}
init();
</script>
